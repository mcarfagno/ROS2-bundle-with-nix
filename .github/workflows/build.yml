name: "Build Workspace"
on:
  push:
    tags:
      - '*'
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
jobs:
  bundle:
    strategy:
      fail-fast: false # one failing target shouldn't cancel the other
      matrix:
        include:
          - { runner: ubuntu-latest, target: ros2-bundle, artifact: ros2-bundle-x86_64 }
          # ARM runners are native aarch64, no QEMU needed
          - { runner: ubuntu-24.04-arm, target: ros2-bundle, artifact: ros2-bundle-aarch64 }
          - { runner: ubuntu-24.04-arm, target: ros2-bundle-jetson, artifact: ros2-bundle-jetson-cuda }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ros
      - run: |
          mkdir deploy_artifacts
          nix bundle .#${{ matrix.target }} -o deploy_artifacts/${{ matrix.artifact }}-arx
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: deploy_artifacts/
