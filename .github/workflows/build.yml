name: "Build Workspace"
on:
  push:
    tags:
      - '*'
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

jobs:
  build-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use ROS Cache
        uses: cachix/cachix-action@v15
        with:
          name: ros

      - name: Create Artifact Directory
        run: mkdir deploy_artifacts

      - name: Bundle ROS2 Workspace
        run: nix bundle .#ros2-bundle -o deploy_artifacts/ros2-bundle-arx

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ros2-fleet-bundles
          path: deploy_artifacts/

  build-jetson:
    runs-on: ubuntu-24.04-arm # native aarch64, no QEMU needed
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use ROS Cache
        uses: cachix/cachix-action@v15
        with:
          name: ros

      - name: Create Artifact Directory
        run: mkdir deploy_artifacts

      - name: Bundle ROS2 Workspace for Jetson
        run: nix bundle .#ros2-bundle-jetson -o deploy_artifacts/ros2-bundle-jetson-arx

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ros2-jetson-bundle
          path: deploy_artifacts/
